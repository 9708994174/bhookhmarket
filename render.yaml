services:
  - type: web
    name: bhookhmarket-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema packages/database/prisma/schema.prisma && npm run build --workspace @bhookhmarket/shared && npm run build --workspace @bhookhmarket/api
    startCommand: node packages/api/dist/api/src/index.js
    healthCheckPath: /health
    envVars:
      # ---- Core ----
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_URL
        value: https://bhookhmarket.onrender.com

      # ---- Database ----
      - key: DATABASE_URL
        sync: false

      # ---- Redis (optional — disables rate limiting if not set) ----
      # Recommended: add a free Upstash Redis URL here
      - key: REDIS_URL
        sync: false

      # ---- JWT ----
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"

      # ---- OTP / SMS ----
      # Set OTP_PROVIDER to the provider you're using.
      # Options: auto | fast2sms | msg91 | twilio | 2factor | mock
      # "auto" tries each provider in order: fast2sms → msg91 → twilio → log
      - key: OTP_PROVIDER
        value: auto
      - key: OTP_DEV_MODE
        value: "false"
      - key: OTP_EXPIRY_MINUTES
        value: "10"

      # Fast2SMS (free India SMS gateway — recommended)
      # Sign up at https://fast2sms.com → Dashboard → API → Dev API Key
      - key: FAST2SMS_API_KEY
        sync: false

      # MSG91 (alternative — set both or neither)
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        value: BHOOKHM

      # Twilio (global fallback — optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ---- Google OAuth ----
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ---- CORS (allow your production domains + any Expo tunnel/client) ----
      # Mobile apps don't send an Origin header so this mainly protects the web dashboard
      - key: CORS_ORIGINS
        value: "https://bhookhmarket.onrender.com,https://bhookhmarket.com,https://www.bhookhmarket.com,exp://localhost:8081"

      # ---- Payments ----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ---- Image Storage ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Firebase Admin (push notifications only, NOT for OTP SMS) ----
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
